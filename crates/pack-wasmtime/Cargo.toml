[package]
name = "packr-wasmtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The native (wasmtime) backend for packr-core's environment-agnostic wasm-backend traits (see docs/engine-axis.md)"

[dependencies]
packr-core = { workspace = true }
wasmtime = "27"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
